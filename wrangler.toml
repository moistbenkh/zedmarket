# Cloudflare Worker configuration. Fill in the two ids marked CHANGE_ME (see docs/deploy.md, steps 5 and 6).
name = "zedmarket"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Static files (style.css) are served straight from Cloudflare's network; the Worker handles everything else.
[assets]
directory = "./public"

# The database connection. Hyperdrive keeps connections to Aiven open and pooled near the database, so each page
# view does not pay for a new TLS handshake. Create it with:  npx wrangler hyperdrive create zed-market-db --connection-string="mysql://app_user:PASSWORD@HOST:PORT/ecommerce"
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "CHANGE_ME_HYPERDRIVE_ID"
# Used only by "wrangler dev" on your own computer (point it at a local MySQL or at Aiven):
localConnectionString = "mysql://app_user:ChangeMe_App_1@127.0.0.1:3306/ecommerce"

# Cache for read-only pages (price list, reports). If the database is ever unreachable the site shows the last good copy.
# Create it with:  npx wrangler kv namespace create CACHE   and paste the id here.
[[kv_namespaces]]
binding = "CACHE"
id = "CHANGE_ME_KV_ID"

# Health check and cache refresh every 30 minutes. The query also keeps the Aiven free database from idling.
[triggers]
crons = ["*/30 * * * *"]

[vars]
# Optional: a URL that receives a plain-text POST when the database is down (for example https://ntfy.sh/your-secret-topic).
ALERT_WEBHOOK_URL = ""
SHOP_NAME = "Zed Market"
# "true" shows the demo logins on the login page. Set to "false" once the project is marked.
SHOW_DEMO_LOGINS = "true"

# Secret (never written in this file):  npx wrangler secret put SESSION_SECRET
